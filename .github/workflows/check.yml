name: Build and smoke-test (no deploy)
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1" # weekly read-only governance audit, no publishing

permissions:
  contents: read

concurrency:
  group: gravimeters-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, SHA-locked 2026-11-22
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Check Python source and environment
        run: |
          python -m compileall -q scripts tests
          python -m pip check
      - name: Build and smoke-test public output
        run: python scripts/smoke_test.py
      - name: Fail-closed governance and provenance audit
        run: python scripts/governance_gate.py
      - name: Test that broken governance states fail
        run: python -m unittest discover -s tests -p 'test_*.py' -v

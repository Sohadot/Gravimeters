name: Reference integrity (read-only observations)

on:
  workflow_dispatch:
  schedule:
    - cron: '18 7 * * 2' # weekly Tuesday observation, no site publication

permissions:
  contents: read

concurrency:
  group: gravimeters-reference-integrity
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # locked v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # locked v5
        with:
          python-version: '3.11'
      - name: Validate reference manifest without network
        run: python scripts/reference_integrity.py --output reference-manifest.json
      - name: Probe source references (observational, no writes)
        run: python scripts/reference_integrity.py --online --output reference-audit.json
      - name: Preserve audit for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # locked v4
        with:
          name: gravimeters-reference-integrity
          path: |
            reference-manifest.json
            reference-audit.json
          if-no-files-found: error
          retention-days: 30

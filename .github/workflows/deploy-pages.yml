name: Publish approved site to GitHub Pages

# Manual GitHub-first public release; never initiated by a PR or merge.
on:
  workflow_dispatch:

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: '3.11'
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and smoke-test public output
        run: python scripts/smoke_test.py
      - name: Re-run governance gate on exact publication source
        run: python scripts/governance_gate.py
      - name: Test that broken governance states are rejected
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # pinned v5
      - name: Upload generated public site ONLY
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # pinned v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # pinned v4
